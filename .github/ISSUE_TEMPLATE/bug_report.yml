name: Bug
description: Report a bug or other issue in GitExtensionsMac
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        GitExtensionsMac is an unofficial macOS port. Please report issues with this app here, not to the upstream [Git Extensions](https://github.com/gitextensions/gitextensions) project.

        ⚠️ Review existing issues to see whether someone else has already reported your issue.
  - type: textarea
    id: about
    attributes:
      label: Environment
      description: Use _Help > Report an issue_ in GitExtensionsMac to copy this information to the clipboard automatically.
      value: |
        - GitExtensionsMac version:
        - Git version:
        - macOS version:
        - Architecture (Apple silicon / Intel):
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Issue description
      description: |
        Be as specific and detailed as possible to help us triage your issue. Screenshots and/or screen recordings can be very useful in helping to understand the issue you're facing.

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Take some time to try and reproduce the issue, then explain how to do so here.
    validations:
      required: true
  - type: textarea
    id: upstream
    attributes:
      label: Does Git Extensions on Windows behave differently?
      description: GitExtensionsMac aims for parity with Git Extensions. If you know how upstream behaves in the same situation, describe it here.
    validations:
      required: false
  - type: textarea
    id: regression
    attributes:
      label: Did this work in a previous version of GitExtensionsMac?
      description: If so, which version?
    validations:
      required: false
